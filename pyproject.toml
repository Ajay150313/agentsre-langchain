[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsre-langchain"
version = "0.1.1"
description = "Semantic SLI monitoring for LangChain agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ajay Devineni"}
]
keywords = ["sre", "monitoring", "langchain", "agents", "semantic", "reliability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = ["langchain>=0.1.0"]

[project.optional-dependencies]
agentsre = ["agentsre>=0.5.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/Ajay150313/agentsre-langchain"
Documentation = "https://github.com/Ajay150313/agentsre-langchain#readme"
Repository = "https://github.com/Ajay150313/agentsre-langchain.git"
Issues = "https://github.com/Ajay150313/agentsre-langchain/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentsre_langchain*"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=agentsre_langchain"
